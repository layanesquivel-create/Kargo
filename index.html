<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>KARGO Bot v9.1</title>
<style>body{margin:0;font-family:Segoe UI,Arial;background:#0b141a;display:flex;justify-content:center}#phone{width:100%;max-width:480px;display:flex;flex-direction:column;height:100vh}header{background:#1f2c34;color:#e9edef;padding:12px;display:flex;gap:10px;align-items:center}.ava{width:42px;height:42px;border-radius:50%;background:#d4af37;display:flex;align-items:center;justify-content:center;font-size:22px}#chat{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.msg{max-width:82%;padding:9px 12px;border-radius:10px;font-size:14px;line-height:1.45;white-space:pre-line}.bot{background:#1f2c34;color:#e9edef;align-self:flex-start}.user{background:#005c4b;color:#e9edef;align-self:flex-end}.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}.chip{background:#005c4b;color:#fff;border:none;border-radius:16px;padding:9px 14px;cursor:pointer;font-size:13px}#bar{display:flex;gap:8px;padding:10px;background:#1f2c34}#input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px;color:#e9edef;font-size:14px}#send{background:#d4af37;border:none;border-radius:50%;width:46px;height:46px;font-size:18px;cursor:pointer}</style></head>
<body>
<div id="phone"><header><div class="ava">🛵</div><div><b>KARGO La Paz</b><br><small id="status">✅ diccionario activo v9.1</small></div></header><div id="chat"></div><div id="bar"><input id="input" placeholder="Ej: plaza uyuni a plaza sucre"/><button id="send">➤</button></div></div>
<script>
const TARIFAS=[[1,9],[2,13],[3,16],[4,20],[5,23],[6,26],[7,30],[8,33],[9,36],[10,40],[15,55],[20,65]];
const KM_EXTRA=2, ESPERA={0:0,5:2,10:4,20:7};
const LUGARES={"estadio hernando siles":[-16.4918,-68.1194,"P"],"estadio":[-16.4918,-68.1194,"P"],"siles":[-16.4918,-68.1194,"P"],"piscina olimpica":[-16.5265,-68.1245,"P"],"piscina":[-16.5265,-68.1245,"P"],"plaza murillo":[-16.4955,-68.1336,"P"],"murillo":[-16.4955,-68.1336,"P"],"plaza espana":[-16.5060,-68.1290,"P"],"españa":[-16.5060,-68.1290,"P"],"plaza abaroa":[-16.5090,-68.1330,"P"],"abaroa":[-16.5090,-68.1330,"P"],"plaza villarroel":[-16.4989,-68.1289,"P"],"villarroel":[-16.4989,-68.1289,"P"],"plaza sucre":[-16.4977,-68.1417,"P"],"sucre":[-16.4977,-68.1417,"P"],"plaza uyuni":[-16.5060,-68.1310,"P"],"uyuni":[-16.5060,-68.1310,"P"],"uyustus":[-16.4925,-68.1360,"P"],"terminal":[-16.4827,-68.1411,"P"],"terminal de buses":[-16.4827,-68.1411,"P"],"aeropuerto":[-16.5133,-68.1923,"P"],"el prado":[-16.4965,-68.1336,"Z"],"prado":[-16.4965,-68.1336,"Z"],"sopocachi":[-16.5065,-68.1355,"Z"],"alto obrajes":[-16.5260,-68.1250,"Z"],"obrajes":[-16.5345,-68.1290,"Z"],"miraflores":[-16.4895,-68.1195,"Z"],"san miguel":[-16.5230,-68.1210,"Z"],"calacoto":[-16.5330,-68.1100,"Z"],"achumani":[-16.5430,-68.1030,"Z"],"cota cota":[-16.5270,-68.1140,"Z"],"irpavi":[-16.5170,-68.1130,"Z"],"san jorge":[-16.5020,-68.1370,"Z"],"tembladerani":[-16.5120,-68.1410,"Z"],"zona sur":[-16.5300,-68.1150,"Z"],"el alto":[-16.5070,-68.1660,"Z"],"la ceja":[-16.5070,-68.1660,"Z"],"satelite":[-16.4710,-68.1480,"Z"],"ciudad satelite":[-16.4710,-68.1480,"Z"],"villa adela":[-16.5170,-68.1480,"Z"],"villa fatima":[-16.4830,-68.1550,"Z"],"san pedro":[-16.5050,-68.1420,"Z"],"pedro":[-16.5050,-68.1420,"Z"],"triangular":[-16.5050,-68.1420,"Z"],"plaza triangular":[-16.5050,-68.1420,"Z"],"camacho":[-16.4955,-68.1355,"Z"],"avenida camacho":[-16.4955,-68.1355,"Z"],"arce":[-16.5020,-68.1400,"Z"],"avenida arce":[-16.5020,-68.1400,"Z"],"perez":[-16.4955,-68.1355,"Z"],"pérez":[-16.4955,-68.1355,"Z"],"la perez":[-16.4955,-68.1355,"Z"],"avenida perez":[-16.4955,-68.1355,"Z"],"armentia":[-16.5180,-68.1290,"Z"],"calle armentia":[-16.5180,-68.1290,"Z"],"calle 21":[-16.5180,-68.1290,"Z"],"21 de calacoto":[-16.5180,-68.1290,"Z"],"la vita":[-16.5180,-68.1290,"Z"]};
const $=id=>document.getElementById(id),chat=$('chat');let cot=null,busy=false,pending=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esNocturno=()=>{const h=new Date().getHours();return h>=22||h<6;};
function addMsg(t,q){const d=document.createElement('div');d.className='msg '+q;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function clearChips(){document.querySelectorAll('.chips').forEach(c=>c.remove());}
function addChips(l){clearChips();const c=document.createElement('div');c.className='chips';l.forEach(([t,f])=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{c.remove();f();};c.appendChild(b);});chat.appendChild(c);chat.scrollTop=chat.scrollHeight;}
async function fetchT(url,opts={},ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opts,signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
function enLaPaz(c){return c&&c[0]>-16.65&&c[0]<-16.40&&c[1]>-68.32&&c[1]<-68.02;}
function buscarEnDiccionario(texto){const t=norm(texto),palabras=t.split(/[\s,\-]+/).filter(p=>p.length>0);for(const [clave,coord] of Object.entries(LUGARES)){if(t.includes(clave)){return {nombre:clave,coords:coord,exacto:true};}}for(const palabra of palabras){for(const [clave,coord] of Object.entries(LUGARES)){if(clave.includes(palabra)&&palabra.length>2){return {nombre:clave,coords:coord,exacto:false};}}}return null;}
function extraerLugares(texto){const t=norm(texto),separadores=/\s+(?:a|hasta|para|hacia|desde|del|de)\s+/,partes=t.split(separadores);if(partes.length<2)return null;const origen=buscarEnDiccionario(partes[0]),destino=buscarEnDiccionario(partes[partes.length-1]);if(origen&&destino){return {origen,destino};}return null;}
async function rutaKm(a,b){try{const d=await fetchT(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=false`,{},9000);if(d.routes&&d.routes.length)return d.routes[0].distance/1000;}catch(e){}const R=6371,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180,s=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(s))*1.3;}
function tarifaKm(km){for(const[l,p]of TARIFAS)if(km<=l)return p;return 65+Math.ceil(km-20)*KM_EXTRA;}
function mostrarCot(){const pe=ESPERA[cot.espera]||0,noche=esNocturno();let total=cot.base+pe;if(noche)total=Math.round(total*1.2);addMsg(`🧾 COTIZACIÓN KARGO\n${cot.precision}\n📍 ${cot.nO} → 🏁 ${cot.nD}\n📏 Distancia: ${cot.km.toFixed(1)} km\n🚦 Ruta: ${cot.base} Bs\n⏱ Espera (${cot.espera} min): +${pe} Bs${noche?'\n🌙 Nocturno +20%':''}\n💰 TOTAL: ${total} Bs`,'bot');addChips([['✅ Confirmar',()=>{addMsg('✅ Confirmar','user');addMsg('¡Pedido registrado! 🛵\n(Próximamente: notificación a drivers)','bot');}],['⏱ +10 min espera',()=>{addMsg('⏱ +10 min espera','user');cot.espera=10;mostrarCot();}],['🔁 Otra cotización',()=>{addMsg('🔁 Otra cotización','user');addMsg('Dale, ¿de dónde a dónde? 😊','bot');}]]);}
async function finalizar(o,d,nO,nD){const kmU=Math.round(await rutaKm(o,d)*10)/10;cot={km:kmU,base:tarifaKm(kmU),espera:0,nO,nD,precision:'🎯 Puntos exactos'};mostrarCot();}
async function procesar(texto){if(busy){addMsg('⏳ Un segundo…','bot');return;}busy=true;clearChips();addMsg(texto,'user');const t=addMsg('🧠 …','bot');try{const res=extraerLugares(texto);t.remove();if(!res){addMsg('🤔 No encontré esos lugares.\nIntenta: "de plaza sucre a obrajes" o "plaza uyuni a plaza villarroel"','bot');busy=false;return;}const {origen,destino}=res;if(!enLaPaz(origen.coords)||!enLaPaz(destino.coords)){addMsg('📍 Lugar fuera de La Paz. Intenta otro.','bot');busy=false;return;}await finalizar(origen.coords,destino.coords,origen.nombre,destino.nombre);}catch(e){t.remove();addMsg('😅 Error de conexión. Intenta de nuevo. 💪','bot');}finally{busy=false;}}
$('send').onclick=()=>{const v=$('input').value.trim();if(!v)return;$('input').value='';procesar(v);};
$('input').onkeydown=e=>{if(e.key==='Enter')$('send').click();};
addMsg('¡Hola! 👋 Soy KARGO v9.1 🛵\n✅ Diccionario activo (100+ lugares)\nEscribe: "de X a Y"\nEj: "plaza uyuni a plaza sucre"');
</script>
</body>
</html>
