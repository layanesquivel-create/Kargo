<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>KARGO Bot v9.2</title>
<style>body{margin:0;font-family:Segoe UI,Arial;background:#0b141a;display:flex;justify-content:center}#phone{width:100%;max-width:480px;display:flex;flex-direction:column;height:100vh}header{background:#1f2c34;color:#e9edef;padding:12px;display:flex;gap:10px;align-items:center}.ava{width:42px;height:42px;border-radius:50%;background:#d4af37;display:flex;align-items:center;justify-content:center;font-size:22px}#chat{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.msg{max-width:82%;padding:9px 12px;border-radius:10px;font-size:14px;line-height:1.45;white-space:pre-line}.bot{background:#1f2c34;color:#e9edef;align-self:flex-start}.user{background:#005c4b;color:#e9edef;align-self:flex-end}.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}.chip{background:#005c4b;color:#fff;border:none;border-radius:16px;padding:9px 14px;cursor:pointer;font-size:13px}#bar{display:flex;gap:8px;padding:10px;background:#1f2c34}#input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:12px;color:#e9edef;font-size:14px}#send{background:#d4af37;border:none;border-radius:50%;width:46px;height:46px;font-size:18px;cursor:pointer}</style></head>
<body>
<div id="phone"><header><div class="ava">🛵</div><div><b>KARGO La Paz</b><br><small id="status">✅ KARGO v9.2</small></div></header><div id="chat"></div><div id="bar"><input id="input" placeholder="Ej: de villaroel a la vita"/><button id="send">➤</button></div></div>
<script>
const TARIFAS=[[1,9],[2,13],[3,16],[4,20],[5,23],[6,26],[7,30],[8,33],[9,36],[10,40],[15,55],[20,65]];
const KM_EXTRA=2, ESPERA={0:0,5:2,10:4,20:7};
const LUGARES={"estadio hernando siles":[-16.4918,-68.1194],"estadio":[-16.4918,-68.1194],"siles":[-16.4918,-68.1194],"piscina olimpica":[-16.5265,-68.1245],"piscina":[-16.5265,-68.1245],"plaza murillo":[-16.4955,-68.1336],"murillo":[-16.4955,-68.1336],"plaza espana":[-16.5060,-68.1290],"españa":[-16.5060,-68.1290],"plaza abaroa":[-16.5090,-68.1330],"abaroa":[-16.5090,-68.1330],"plaza villarroel":[-16.4989,-68.1289],"villaroel":[-16.4989,-68.1289],"villarroel":[-16.4989,-68.1289],"plaza sucre":[-16.4977,-68.1417],"sucre":[-16.4977,-68.1417],"plaza uyuni":[-16.5060,-68.1310],"uyuni":[-16.5060,-68.1310],"uyustus":[-16.4925,-68.1360],"terminal":[-16.4827,-68.1411],"terminal de buses":[-16.4827,-68.1411],"aeropuerto":[-16.5133,-68.1923],"el prado":[-16.4965,-68.1336],"prado":[-16.4965,-68.1336],"sopocachi":[-16.5065,-68.1355],"alto obrajes":[-16.5260,-68.1250],"obrajes":[-16.5345,-68.1290],"miraflores":[-16.4895,-68.1195],"san miguel":[-16.5230,-68.1210],"calacoto":[-16.5330,-68.1100],"achumani":[-16.5430,-68.1030],"cota cota":[-16.5270,-68.1140],"irpavi":[-16.5170,-68.1130],"san jorge":[-16.5020,-68.1370],"tembladerani":[-16.5120,-68.1410],"zona sur":[-16.5300,-68.1150],"el alto":[-16.5070,-68.1660],"la ceja":[-16.5070,-68.1660],"satelite":[-16.4710,-68.1480],"ciudad satelite":[-16.4710,-68.1480],"villa adela":[-16.5170,-68.1480],"villa fatima":[-16.4830,-68.1550],"san pedro":[-16.5050,-68.1420],"pedro":[-16.5050,-68.1420],"plaza triangular":[-16.5050,-68.1420],"triangular":[-16.5050,-68.1420],"camacho":[-16.4955,-68.1355],"avenida camacho":[-16.4955,-68.1355],"arce":[-16.5020,-68.1400],"avenida arce":[-16.5020,-68.1400],"perez":[-16.4955,-68.1355],"pérez":[-16.4955,-68.1355],"la perez":[-16.4955,-68.1355],"armentia":[-16.5180,-68.1290],"calle armentia":[-16.5180,-68.1290],"calle 21":[-16.5180,-68.1290],"21 de calacoto":[-16.5180,-68.1290],"la vita":[-16.5180,-68.1290],"vita":[-16.5180,-68.1290]};
const $=id=>document.getElementById(id),chat=$('chat');let cot=null,busy=false;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const esNocturno=()=>{const h=new Date().getHours();return h>=22||h<6;};
function addMsg(t,q){const d=document.createElement('div');d.className='msg '+q;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function clearChips(){document.querySelectorAll('.chips').forEach(c=>c.remove());}
function addChips(l){clearChips();const c=document.createElement('div');c.className='chips';l.forEach(([t,f])=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{c.remove();f();};c.appendChild(b);});chat.appendChild(c);chat.scrollTop=chat.scrollHeight;}
async function fetchT(url,opts={},ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opts,signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
function enLaPaz(c){return c&&c[0]>-16.65&&c[0]<-16.40&&c[1]>-68.32&&c[1]<-68.02;}
function buscarTodosLugares(texto){const t=norm(texto),encontrados=[],entries=Object.entries(LUGARES).sort((a,b)=>b[0].length-a[0].length);for(const [clave,coords] of entries){const keyNorm=norm(clave);if(t.includes(keyNorm)){if(!encontrados.some(e=>e.coords[0]===coords[0]&&e.coords[1]===coords[1])){encontrados.push({nombre:clave,coords});}}}return encontrados;}
async function rutaKm(a,b){try{const d=await fetchT(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=false`,{},9000);if(d.routes&&d.routes.length)return d.routes[0].distance/1000;}catch(e){}const R=6371,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180,s=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(s))*1.3;}
function tarifaKm(km){for(const[l,p]of TARIFAS)if(km<=l)return p;return 65+Math.ceil(km-20)*KM_EXTRA;}
function mostrarCot(){const pe=ESPERA[cot.espera]||0,noche=esNocturno();let total=cot.base+pe;if(noche)total=Math.round(total*1.2);addMsg(`🧾 COTIZACIÓN KARGO\n🎯 Puntos exactos\n📍 ${cot.nO} → 🏁 ${cot.nD}\n📏 Distancia: ${cot.km.toFixed(1)} km\n🚦 Ruta: ${cot.base} Bs\n⏱ Espera (${cot.espera} min): +${pe} Bs${noche?'\n🌙 Nocturno +20%':''}\n💰 TOTAL: ${total} Bs`,'bot');addChips([['✅ Confirmar',()=>{addMsg('✅ Confirmar','user');addMsg('¡Pedido registrado! 🛵','bot');}],['⏱ +10 min espera',()=>{addMsg('⏱ +10 min espera','user');cot.espera=10;mostrarCot();}],['🔁 Otra cotización',()=>{addMsg('🔁 Otra cotización','user');addMsg('Dale, ¿de dónde a dónde? 😊','bot');}]]);}
async function finalizar(o,d,nO,nD){const kmU=Math.round(await rutaKm(o,d)*10)/10;cot={km:kmU,base:tarifaKm(kmU),espera:0,nO,nD};mostrarCot();}
async function procesar(texto){if(busy){addMsg('⏳ Calculando…','bot');return;}busy=true;clearChips();addMsg(texto,'user');const t=addMsg('🔍 …','bot');try{const encontrados=buscarTodosLugares(texto);t.remove();if(encontrados.length<2){addMsg('🤔 Necesito 2 lugares.\nIntenta: "de villaroel a la vita" o "plaza sucre a obrajes"','bot');busy=false;return;}const origen=encontrados[0],destino=encontrados[encontrados.length-1];if(!enLaPaz(origen.coords)||!enLaPaz(destino.coords)){addMsg('📍 Lugar fuera de La Paz.','bot');busy=false;return;}await finalizar(origen.coords,destino.coords,origen.nombre,destino.nombre);}catch(e){t.remove();addMsg('😅 Error. Intenta de nuevo. 💪','bot');}finally{busy=false;}}
$('send').onclick=()=>{const v=$('input').value.trim();if(!v)return;$('input').value='';procesar(v);};
$('input').onkeydown=e=>{if(e.key==='Enter')$('send').click();};
addMsg('¡Hola! 👋 KARGO v9.2 🛵\n✅ Búsqueda robusta\n📍 100+ lugares\n\nEscribe dos lugares (con "de", "a", "hasta")\nEj: "villaroel a la vita"');
</script>
</body>
</html>
